name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run spellcheck
      - run: npm run check:links
      - run: npm run check:metadata
      - run: npm run check:content
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install "./workers/rfb_cnpj[test]"
      - run: npm run worker:test

  github-pages-runtime:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RUNTIME_TARGET: github-pages
      NEXT_PUBLIC_STATIC_EXPORT: "true"
      NEXT_PUBLIC_BASE_PATH: /prospecta-nicho
      NEXT_PUBLIC_SUPABASE_URL: https://static-runtime-test.supabase.co
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/github-pages-static.test.mjs tests/final-hardening.test.mjs
      - run: npm run export:github
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:github-pages
